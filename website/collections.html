<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collections — TABBE Designs</title>
  <meta name="description" content="The worlds of TABBE Designs — Cotton Candy, Bubble Wrap, The Butterfly Effect and In Play. Sculptural fashion handmade in NYC." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%238a5cff'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="header-mount"></div>

  <main>
    <section class="page-hero wrap">
      <span class="eyebrow" data-reveal style="justify-content:center">The worlds of TABBE</span>
      <h1 data-reveal data-reveal-delay="1">Collections</h1>
      <p data-reveal data-reveal-delay="2">Each collection is a different feeling — translated into volume, print and pure latex. Step into the one that speaks to you.</p>
    </section>

    <section class="section wrap">
      <div class="collection-row" id="collectionsBig"></div>
    </section>

    <section class="wrap" id="collectionSections" style="padding-bottom:4rem"></section>
  </main>

  <div id="footer-mount"></div>

  <script src="js/products.js"></script>
  <script src="js/site.js"></script>
  <script>
    (function () {
      const rep = (c) => PRODUCTS.find((p) => p.collection === c.name) || PRODUCTS[0];
      document.getElementById("collectionsBig").innerHTML = COLLECTIONS.map((c) => `
        <a class="collection-card" href="#${c.id}" data-reveal>
          <img src="${TABBE.img(rep(c))}" alt="${c.name}" loading="lazy">
          <div class="info"><div class="season">${c.season}</div><h3>${c.name}</h3>
            <p style="opacity:.85;font-size:.85rem;margin-top:.3rem;color:#fff">${c.blurb}</p>
            <span class="go">Shop the world →</span></div>
        </a>`).join("");

      document.getElementById("collectionSections").innerHTML = COLLECTIONS.map((c) => {
        const items = PRODUCTS.filter((p) => p.collection === c.name);
        if (!items.length) return "";
        return `<section class="section" id="${c.id}" style="scroll-margin-top:90px">
          <div class="head-row"><div><span class="eyebrow">${c.season}</span><h2 style="margin-top:.5rem">${c.name}</h2><p>${c.blurb}</p></div></div>
          <div class="grid-products">${items.map((p) => TABBE.productCard(p)).join("")}</div>
        </section>`;
      }).join("");

      TABBE.reveals();
    })();
  </script>
</body>
</html>
