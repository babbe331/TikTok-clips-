<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — TABBE Designs</title>
  <meta name="description" content="Shop TABBE Designs — ready-to-wear and made-to-order latex couture. Dresses, tops, bodysuits, matching sets and accessories, handmade in NYC." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%238a5cff'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="header-mount"></div>

  <main>
    <section class="shop-hero wrap">
      <span class="eyebrow">The shop</span>
      <h1 id="shopTitle">Wear how you feel</h1>
      <p class="muted" style="max-width:48ch;margin-top:.8rem">Every piece is designed and handmade in New York City. Filter by world, category, or price to find your feeling.</p>

      <div class="chips" id="lineChips" style="margin-top:1.6rem"></div>

      <div class="toolbar">
        <div class="chips" id="catChips"></div>
        <div class="spacer"></div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="shopSearch" type="search" placeholder="Search pieces" aria-label="Search" />
        </div>
        <select class="select" id="shopSort" aria-label="Sort">
          <option value="featured">Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
          <option value="name">Alphabetical</option>
        </select>
      </div>
    </section>

    <section class="wrap" style="padding-bottom:5rem">
      <div class="result-count" id="resultCount"></div>
      <div class="grid-products" id="shopGrid"></div>
    </section>
  </main>

  <div id="footer-mount"></div>

  <script src="js/products.js"></script>
  <script src="js/site.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
